name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Build Sphinx HTML
        run: sphinx-build -W --keep-going -b html docs/ docs/_build/html

      - id: pages-site
        name: Check whether GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          umask 077
          pages_response="$(mktemp)"
          trap 'rm -f "$pages_response"' EXIT
          status="$(curl -sS -o "$pages_response" -w "%{http_code}" \
            -H "Authorization: $(printf 'Bearer %s' "$GH_TOKEN")" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pages")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GitHub Pages API request failed with HTTP status $status."
            cat "$pages_response"
            exit 1
          fi

      - if: steps.pages-site.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages-site.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Skip deployment when GitHub Pages is disabled
        if: steps.pages-site.outputs.enabled != 'true'
        run: echo "::notice::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}; skipping deployment."

      - id: deployment
        if: steps.pages-site.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
